name: Refurb Monitor Stock Checks

on:
  schedule:
    - cron: '0 11,12,18,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refurb-monitor-stock
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Gate UK midday/evening schedule
        id: gate
        shell: bash
        run: |
          should_run=true
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            hour=$(TZ=Europe/London date +%H)
            if [[ "$hour" != "12" && "$hour" != "19" ]]; then
              echo "Skipping duplicate UTC trigger outside 12:00/19:00 Europe/London."
              should_run=false
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'
      - name: Restore published docs cache
        if: steps.gate.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: docs/
          key: refurb-pages-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            refurb-pages-${{ github.ref_name }}-
      - name: Restore stock monitor state cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: monitor/output/stock_monitor_state.json
          key: stock-monitor-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-monitor-state-${{ github.ref_name }}-
      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r monitor/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run stock monitor
        if: steps.gate.outputs.should_run == 'true'
        run: python -m monitor.run_stock_monitor --verbose
      - name: Upload debug outputs
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refurb-monitor-stock-output
          path: monitor/output/
      - name: Upload generated docs
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refurb-monitor-stock-docs
          path: docs/
      - name: Save stock monitor state cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: monitor/output/stock_monitor_state.json
          key: stock-monitor-state-${{ github.ref_name }}-${{ github.run_id }}
      - name: Save published docs cache
        if: steps.gate.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: docs/
          key: refurb-pages-${{ github.ref_name }}-${{ github.run_id }}
      - name: Upload Pages artifact
        if: steps.gate.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
        id: deploy
        uses: actions/deploy-pages@v4
