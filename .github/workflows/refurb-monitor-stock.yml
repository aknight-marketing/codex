name: Refurb Monitor Stock Checks

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refurb-monitor-stock
  cancel-in-progress: false

jobs:
  stock-check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monitor/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run stock monitor
        run: python -m monitor.run_stock_monitor --verbose
      - name: Upload debug outputs
        uses: actions/upload-artifact@v4
        with:
          name: refurb-monitor-stock-output
          path: monitor/output/
      - name: Upload generated docs
        uses: actions/upload-artifact@v4
        with:
          name: refurb-monitor-stock-docs
          path: docs/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deploy
        uses: actions/deploy-pages@v4
