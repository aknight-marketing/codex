name: Validate GitHub Actions Workflows

on:
  pull_request:
  push:
    branches:
      - main
      - work
      - 'codex/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflow files
        uses: rhysd/actionlint@v1
